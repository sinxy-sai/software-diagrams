name: Cross-platform render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            bootstrap: bash scripts/bootstrap.sh
            render: npm run render:unix
          - os: macos-latest
            shell: bash
            bootstrap: bash scripts/bootstrap.sh
            render: npm run render:unix
          - os: windows-latest
            shell: pwsh
            bootstrap: pwsh -NoProfile -File scripts/bootstrap.ps1
            render: npm run render

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned renderers
        shell: ${{ matrix.shell }}
        run: ${{ matrix.bootstrap }}

      - name: Render example gallery
        shell: ${{ matrix.shell }}
        run: ${{ matrix.render }}
