name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Java renderers
        run: bash scripts/bootstrap.sh

      - name: Render the example gallery
        run: npm run render:unix

      - name: Package the tagged repository
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./tools/bin' \
            -czf "software-diagrams-${TAG}.tar.gz" .
          sha256sum "software-diagrams-${TAG}.tar.gz" > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            software-diagrams-${{ github.ref_name }}.tar.gz
            SHA256SUMS
