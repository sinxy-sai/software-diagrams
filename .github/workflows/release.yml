name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Java renderers
        run: bash scripts/bootstrap.sh

      - name: Render the example gallery
        run: npm run render:unix

      - name: Determine release channel
        id: release_meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the skill
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_dir="dist/software-diagrams-${TAG}"
          mkdir -p "$package_dir"
          cp SKILL.md README.md LICENSE AGENTS.md CLAUDE.md "$package_dir/"
          cp -R agents references "$package_dir/"
          tar -czf "software-diagrams-${TAG}-skill.tar.gz" -C dist "software-diagrams-${TAG}"
          sha256sum "software-diagrams-${TAG}-skill.tar.gz" > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: .github/RELEASE_TEMPLATE.md
          generate_release_notes: true
          prerelease: false
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          files: |
            software-diagrams-${{ github.ref_name }}-skill.tar.gz
            SHA256SUMS
