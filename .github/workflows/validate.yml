name: Validate diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      SOFTWARE_DIAGRAMS_TOOLS: ${{ github.workspace }}/sd-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: node scripts/sd.mjs ensure plantuml structurizr
      - run: npm run render:unix
